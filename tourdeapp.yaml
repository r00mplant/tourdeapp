# $schema: https://tourde.cloud/api/v2/schema
exposedPort: 80

containers:
  - name: frontend
    image: registry.tourde.cloud/roomplants/frontend
    port: 3001
  - name: caddy
    image: registry.tourde.cloud/roomplants/caddy
    port: 80
  - name: backend
    image: registry.tourde.cloud/roomplants/backend
    port: 8000
    env:
      DATABASE_URL: postgres://admin:admin1234@database:5432/tourdeapp
  - name: database
    image: postgres
    tag: "17-alpine"
    env:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: tourdeapp
      DATABASE_URL: postgresql+psycopg2://admin:admin1234@localhost:5432/tourdeapp
    port: 5432

build:
  - name: frontend
    context: ./Frontend
    dockerfile: ./Frontend/dockerfile
  - name: caddy
    context: ./Caddy
    dockerfile: ./Caddy/dockerfile
  - name: backend
    context: ./Backend
    dockerfile: ./Backend/dockerfile