# $schema: https://tourde.cloud/api/v2/schema
exposedPort: 80

containers:
  - name: frontend
    image: registry.tourde.cloud/roomplants/frontend
    port: 3001
  - name: caddy
    image: registry.tourde.cloud/roomplants/caddy
    port: 80
  - name: backend
    image: registry.tourde.cloud/roomplants/backend
    port: 8000

build:
  - name: frontend
    context: ./Frontend
    dockerfile: ./Frontend/dockerfile
  - name: caddy
    context: ./Caddy
    dockerfile: ./Caddy/dockerfile
  - name: backend
    context: ./Backend
    dockerfile: ./Backend/dockerfile